<!doctype html>
<html lang="zh-CN">
<head>
  <style id="edgeone-watermark-override">#edgeone-watermark{display:none!important}</style>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>质因数拆解挑战｜鲁老师小课堂</title>
  <meta name="description" content="选择质因数和乘号，把合数分解成质数相乘的形式。">
  <script>
    (() => {
      const PAGE_VERSION = '2026.09.18.2';
      async function checkForUpdate() {
        try {
          const response = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
          if (!response.ok) return;
          const latest = await response.json();
          if (latest.version && latest.version !== PAGE_VERSION) {
            const key = 'prime-factor-reload-' + latest.version;
            if (sessionStorage.getItem(key)) return;
            sessionStorage.setItem(key, '1');
            const next = new URL(location.href);
            next.searchParams.set('v', latest.version);
            location.replace(next.href);
          }
        } catch (_) {}
      }
      if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
        addEventListener('load', async () => {
          try {
            const registration = await navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });
            registration.update();
          } catch (_) {}
          checkForUpdate();
        });
        addEventListener('pageshow', checkForUpdate);
        addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });
      }
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%231c6b61'/%3E%3Ccircle cx='21' cy='25' r='11' fill='%23ffd763'/%3E%3Ccircle cx='43' cy='39' r='11' fill='%23ff8a5b'/%3E%3Cpath d='M27 30l10 5' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#173a43;--muted:#61767a;--green:#166b61;--green2:#238d7e;--cream:#f7f4e9;--paper:#fffef9;--yellow:#ffd45e;--orange:#ff8255;--red:#d84f4f;--blue:#4d82c4;--line:#d7e3df;--shadow:0 18px 48px rgba(30,72,71,.12)}
    *{box-sizing:border-box}
    html{font-size:16px}
    body{margin:0;min-height:100vh;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--cream);background-image:radial-gradient(circle at 20px 20px,rgba(22,107,97,.055) 1.5px,transparent 1.6px);background-size:28px 28px}
    button,input{font:inherit}
    button{touch-action:manipulation}
    .page{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:24px 0 40px}
    header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}
    .brand{display:flex;align-items:center;gap:14px}
    .teacher{width:70px;height:70px;border-radius:20px;object-fit:cover;object-position:center 16%;border:4px solid white;box-shadow:0 8px 22px rgba(23,58,67,.18)}
    .kicker{margin:0 0 3px;color:var(--green);font-weight:900;letter-spacing:.12em;font-size:.84rem}
    h1{margin:0;font-size:clamp(1.45rem,3vw,2.25rem);line-height:1.1;letter-spacing:-.04em}
    .round-badge{display:flex;align-items:center;gap:8px;padding:10px 15px;border:1px solid #cbdad6;border-radius:999px;background:rgba(255,255,255,.72);font-weight:800;white-space:nowrap}
    .round-badge b{color:var(--green);font-size:1.15rem}
    main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
    .board,.settings{background:rgba(255,254,249,.95);border:1px solid rgba(22,107,97,.16);box-shadow:var(--shadow)}
    .board{border-radius:28px;overflow:hidden}
    .question{position:relative;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:30px 34px;background:var(--green);color:#fff;overflow:hidden}
    .question:after{content:"2  3  5  7  11  13";position:absolute;right:-18px;bottom:-11px;color:rgba(255,255,255,.08);font-size:4rem;font-weight:1000;letter-spacing:.08em;white-space:nowrap;transform:rotate(-5deg)}
    .question-copy{position:relative;z-index:1}
    .question-label{display:inline-flex;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.15);font-weight:800;font-size:.88rem}
    .question h2{margin:9px 0 2px;font-size:clamp(1.15rem,2vw,1.45rem)}
    .question p{margin:0;color:rgba(255,255,255,.76)}
    .target{position:relative;z-index:1;display:grid;place-items:center;min-width:145px;height:118px;padding:10px 24px;border-radius:24px;background:var(--yellow);color:#153f45;box-shadow:0 9px 0 #d4a92f;font-size:clamp(3rem,8vw,5rem);font-weight:1000;line-height:1}
    .work{padding:28px 34px 32px}
    .section-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px}
    .section-title h3{margin:0;font-size:1.12rem}
    .section-title span{color:var(--muted);font-size:.88rem}
    .equation{min-height:98px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:18px 20px;border:2px dashed #bcd0ca;border-radius:20px;background:#f7fbf8;transition:.2s}
    .equation.shake{animation:shake .35s}
    .equals-target{font-size:1.8rem;font-weight:1000;color:var(--green);margin-right:2px}
    .eq-mark{font-size:1.7rem;font-weight:900;color:#8ba09c}
    .placeholder{color:#91a29f;font-weight:700}
    .token{display:grid;place-items:center;min-width:50px;height:50px;padding:0 12px;border-radius:14px;background:white;border:2px solid #d7e2de;box-shadow:0 4px 0 #cbd8d4;font-size:1.4rem;font-weight:1000}
    .token.multiply{min-width:38px;border:0;box-shadow:none;background:transparent;color:var(--orange);font-size:1.8rem}
    .keypad{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
    .factor-key,.multiply-key{min-width:66px;height:62px;padding:0 16px;border:0;border-radius:17px;color:white;font-size:1.4rem;font-weight:1000;cursor:pointer;box-shadow:0 6px 0 rgba(20,58,63,.22);transition:transform .12s,box-shadow .12s}
    .factor-key{background:var(--blue)}
    .factor-key:nth-child(3n+2){background:var(--green2)}
    .factor-key:nth-child(3n){background:#7469b6}
    .multiply-key{background:var(--orange);font-size:1.8rem}
    .factor-key:active,.multiply-key:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(20,58,63,.2)}
    .edit-row,.action-row{display:flex;gap:10px;flex-wrap:wrap}
    .edit-row{margin:16px 0 8px}
    .small-btn,.main-btn{border:0;border-radius:13px;font-weight:900;cursor:pointer}
    .small-btn{padding:11px 16px;background:#e8efec;color:var(--ink)}
    .small-btn:hover{background:#dce8e3}
    .feedback{min-height:67px;margin:18px 0 14px;padding:15px 18px;border-radius:16px;display:flex;align-items:center;gap:11px;background:#eef4f1;color:var(--muted);font-weight:800}
    .feedback .icon{font-size:1.35rem}
    .feedback.good{background:#ddf5e9;color:#176342}
    .feedback.bad{background:#ffe4df;color:#9c3b32}
    .feedback.answer{background:#fff2c8;color:#765b10}
    .action-row .main-btn{min-height:52px;padding:0 22px}
    .check{flex:1;background:var(--yellow);color:#173a43;box-shadow:0 6px 0 #d5ab35;font-size:1.08rem}
    .reveal{background:var(--ink);color:#fff}
    .retry{background:#fff;border:2px solid #d2dfdb;color:var(--ink)}
    .main-btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
    .settings{border-radius:24px;padding:22px;position:sticky;top:16px}
    .settings h2{font-size:1.2rem;margin:0 0 18px}
    .field{margin:0 0 20px}
    .field-label{display:block;margin-bottom:9px;font-weight:900}
    .range{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
    input[type=number]{width:100%;min-width:0;padding:11px 10px;border:2px solid #d5e2de;border-radius:12px;background:#fff;text-align:center;font-weight:900;color:var(--ink);outline:none}
    input[type=number]:focus{border-color:var(--green2)}
    .prime-options{display:flex;flex-wrap:wrap;gap:8px}
    .prime-toggle{min-width:48px;padding:9px 10px;border:2px solid #d7e2de;border-radius:12px;background:#fff;color:#758783;font-weight:900;cursor:pointer}
    .prime-toggle.active{border-color:var(--green);background:var(--green);color:white}
    .add-prime{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
    .add-prime button{border:0;border-radius:12px;padding:0 13px;background:#dcebe6;color:var(--green);font-weight:1000;cursor:pointer}
    .hint{margin:8px 0 0;color:var(--muted);font-size:.82rem;line-height:1.5}
    .apply{width:100%;min-height:50px;border:0;border-radius:14px;background:var(--green);color:#fff;font-weight:1000;cursor:pointer}
    .settings-error{min-height:24px;color:var(--red);font-size:.86rem;font-weight:800;margin-top:8px}
    .mini-rule{margin-top:18px;padding:14px;border-radius:15px;background:#edf5f2;font-size:.88rem;line-height:1.65;color:#4f6968}
    .mini-rule b{color:var(--green)}
    .confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
    .confetti i{position:absolute;top:-20px;width:12px;height:20px;border-radius:3px;animation:fall 1.05s ease-in forwards}
    @keyframes fall{to{transform:translate(var(--drift),110vh) rotate(620deg)}}
    @keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
    @media(max-width:820px){.page{width:min(100% - 20px,700px);padding-top:12px}header{margin-bottom:12px}.teacher{width:58px;height:58px;border-radius:16px}main{grid-template-columns:1fr}.settings{position:static;order:-1;padding:0;overflow:hidden}.settings details{padding:0}.settings summary{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;font-weight:1000;cursor:pointer;list-style:none}.settings summary:after{content:"展开";font-size:.84rem;color:var(--green)}.settings details[open] summary:after{content:"收起"}.settings-body{padding:0 18px 18px}.settings h2{display:none}.question{padding:22px 20px;grid-template-columns:1fr auto}.target{min-width:112px;height:96px;border-radius:20px}.work{padding:22px 18px 24px}.round-badge{display:none}}
    @media(min-width:821px){.settings summary{display:none}.settings details>.settings-body{display:block!important}}
    @media(max-width:520px){h1{font-size:1.35rem}.kicker{font-size:.75rem}.brand{gap:10px}.question{grid-template-columns:1fr;padding:20px}.question-copy{text-align:center}.target{width:100%;height:100px}.section-title{display:block}.section-title span{display:block;margin-top:4px}.equation{min-height:88px;padding:14px}.factor-key,.multiply-key{min-width:56px;height:56px;padding:0 13px}.action-row{display:grid;grid-template-columns:1fr 1fr}.check{grid-column:1/-1;min-height:56px}.main-btn{min-height:48px!important;padding:0 12px!important}.feedback{margin-top:15px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand"><img class="teacher" src="teacher.png" alt="鲁老师"><div><p class="kicker">鲁老师小课堂</p><h1>质因数拆解挑战</h1></div></div>
      <div class="round-badge">连续答对 <b id="streak">0</b> 题</div>
    </header>
    <main>
      <section class="board" aria-label="质因数分解答题区">
        <div class="question">
          <div class="question-copy"><span class="question-label" id="questionNo">第 1 题</span><h2>把这个合数分解成质因数</h2><p>每个质因数和乘号都要自己点出来</p></div>
          <div class="target" id="target" aria-live="polite">84</div>
        </div>
        <div class="work">
          <div class="section-title"><h3>我的算式</h3><span>顺序不同也可以，只要分解正确</span></div>
          <div class="equation" id="equation" aria-live="polite"></div>
          <div class="keypad" id="keypad" aria-label="质因数和乘号按钮"></div>
          <div class="edit-row"><button class="small-btn" id="undo" type="button">↶ 退一步</button><button class="small-btn" id="clear" type="button">清空算式</button></div>
          <div class="feedback" id="feedback" aria-live="polite"><span class="icon">💡</span><span>先选一个质因数，再别忘了点乘号。</span></div>
          <div class="action-row"><button class="main-btn check" id="check" type="button">检验答案</button><button class="main-btn reveal" id="reveal" type="button">显示答案</button><button class="main-btn retry" id="retry" type="button">重新答这题</button></div>
        </div>
      </section>
      <aside class="settings">
        <details id="settingsPanel">
          <summary>⚙ 出题设置</summary>
          <div class="settings-body">
            <h2>出题设置</h2>
            <div class="field"><label class="field-label">合数范围</label><div class="range"><input id="min" type="number" min="4" max="9999" value="4" aria-label="最小合数"><span>至</span><input id="max" type="number" min="4" max="9999" value="100" aria-label="最大合数"></div></div>
            <div class="field"><span class="field-label">可以使用的质因数</span><div class="prime-options" id="primeOptions"></div><div class="add-prime"><input id="newPrime" type="number" min="2" max="997" placeholder="如 17、19" aria-label="增加质因数"><button id="addPrime" type="button">增加</button></div><p class="hint">点数字可以启用或停用；新增加的质数也会出现在答题按钮中。</p></div>
            <button class="apply" id="apply" type="button">保存设置并出新题</button><div class="settings-error" id="settingsError" aria-live="polite"></div>
            <div class="mini-rule"><b>什么是质因数？</b><br>既是质数，又是这个合数的因数。一个质因数可以重复使用。</div>
          </div>
        </details>
      </aside>
    </main>
  </div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <script>
  (()=>{
    'use strict';
    const $=s=>document.querySelector(s);
    const els={target:$('#target'),questionNo:$('#questionNo'),equation:$('#equation'),keypad:$('#keypad'),feedback:$('#feedback'),undo:$('#undo'),clear:$('#clear'),check:$('#check'),reveal:$('#reveal'),retry:$('#retry'),min:$('#min'),max:$('#max'),primeOptions:$('#primeOptions'),newPrime:$('#newPrime'),addPrime:$('#addPrime'),apply:$('#apply'),settingsError:$('#settingsError'),settingsPanel:$('#settingsPanel'),streak:$('#streak'),confetti:$('#confetti')};
    const state={available:[2,3,5,7,11,13],enabled:new Set([2,3,5,7,11,13]),tokens:[],current:84,question:0,streak:0,locked:false,last:null};

    function isPrime(n){if(!Number.isInteger(n)||n<2)return false;if(n%2===0)return n===2;for(let i=3;i*i<=n;i+=2)if(n%i===0)return false;return true}
    function activePrimes(){return [...state.enabled].sort((a,b)=>a-b)}
    function factorize(n,primes=activePrimes()){let left=n,out=[];for(const p of primes){while(left%p===0){out.push(p);left/=p}}return left===1&&out.length>=2?out:null}
    function candidates(){const lo=Number(els.min.value),hi=Number(els.max.value);const out=[];for(let n=lo;n<=hi;n++)if(factorize(n))out.push(n);return out}
    function setFeedback(type,icon,text){els.feedback.className='feedback'+(type?' '+type:'');els.feedback.innerHTML=`<span class="icon">${icon}</span><span>${text}</span>`}
    function renderEquation(){els.equation.innerHTML=`<span class="equals-target">${state.current}</span><span class="eq-mark">=</span>`;if(!state.tokens.length){const hint=document.createElement('span');hint.className='placeholder';hint.textContent='在下面选择质因数和 ×';els.equation.append(hint)}else state.tokens.forEach(v=>{const t=document.createElement('span');t.className='token'+(v==='×'?' multiply':'');t.textContent=v;els.equation.append(t)});els.undo.disabled=!state.tokens.length||state.locked;els.clear.disabled=!state.tokens.length||state.locked}
    function addToken(value){if(state.locked)return;state.tokens.push(value);renderEquation();setFeedback('','✏️','继续完成算式，写好后点“检验答案”。')}
    function renderKeypad(){els.keypad.innerHTML='';activePrimes().forEach(p=>{const b=document.createElement('button');b.type='button';b.className='factor-key';b.textContent=p;b.setAttribute('aria-label','选择质因数 '+p);b.addEventListener('click',()=>addToken(p));els.keypad.append(b)});const x=document.createElement('button');x.type='button';x.className='multiply-key';x.textContent='×';x.setAttribute('aria-label','添加乘号');x.addEventListener('click',()=>addToken('×'));els.keypad.append(x)}
    function renderPrimeOptions(){els.primeOptions.innerHTML='';state.available.sort((a,b)=>a-b).forEach(p=>{const b=document.createElement('button');b.type='button';b.className='prime-toggle'+(state.enabled.has(p)?' active':'');b.textContent=p;b.setAttribute('aria-pressed',state.enabled.has(p));b.addEventListener('click',()=>{state.enabled.has(p)?state.enabled.delete(p):state.enabled.add(p);renderPrimeOptions()});els.primeOptions.append(b)})}
    function newQuestion(){const pool=candidates();if(!pool.length){els.settingsError.textContent='这个设置暂时出不了题，请扩大范围或多启用几个质因数。';return false}els.settingsError.textContent='';let pick=pool[Math.floor(Math.random()*pool.length)];if(pool.length>1&&pick===state.last)pick=pool[(pool.indexOf(pick)+1)%pool.length];state.last=pick;state.current=pick;state.tokens=[];state.locked=false;state.question++;els.target.textContent=pick;els.questionNo.textContent=`第 ${state.question} 题`;els.check.disabled=false;els.reveal.disabled=false;renderEquation();setFeedback('','💡','先选一个质因数，再别忘了点乘号。');return true}
    function grammarOk(){if(!state.tokens.length||state.tokens.length%2===0)return false;return state.tokens.every((v,i)=>i%2===0?typeof v==='number':v==='×')}
    function celebrate(){els.confetti.innerHTML='';const colors=['#ffd45e','#ff8255','#238d7e','#4d82c4','#7469b6'];for(let i=0;i<34;i++){const bit=document.createElement('i');bit.style.left=Math.random()*100+'%';bit.style.background=colors[i%colors.length];bit.style.setProperty('--drift',(Math.random()*180-90)+'px');bit.style.animationDelay=Math.random()*.2+'s';els.confetti.append(bit)}setTimeout(()=>els.confetti.innerHTML='',1300)}
    function checkAnswer(){if(state.locked)return;if(!grammarOk()){wrong('算式还没有写完整。要按照“质因数 × 质因数”的顺序填写。');return}const nums=state.tokens.filter(v=>typeof v==='number');const product=nums.reduce((a,b)=>a*b,1);if(product!==state.current){wrong(`这些数相乘得到 ${product}，还不是 ${state.current}，再调整一下。`);return}state.locked=true;state.streak++;els.streak.textContent=state.streak;els.check.disabled=true;els.reveal.disabled=true;setFeedback('good','🎉',`正确！${state.current} 正好等于这些质因数的乘积。准备下一题……`);celebrate();setTimeout(newQuestion,1200)}
    function wrong(message){state.streak=0;els.streak.textContent=0;setFeedback('bad','✕',message);els.equation.classList.remove('shake');void els.equation.offsetWidth;els.equation.classList.add('shake')}
    function reveal(){const answer=factorize(state.current);state.tokens=[];answer.forEach((p,i)=>{if(i)state.tokens.push('×');state.tokens.push(p)});renderEquation();setFeedback('answer','👀',`答案：${state.current} = ${answer.join(' × ')}。看清楚后，可以点“重新答这题”自己再做一次。`)}
    function resetAnswer(){if(state.locked)return;state.tokens=[];renderEquation();setFeedback('','🔄','已经清空，重新分解这个合数吧。')}
    function addPrime(){const p=Number(els.newPrime.value);if(!isPrime(p)){els.settingsError.textContent='请输入一个质数，例如 17 或 19。';return}if(!state.available.includes(p))state.available.push(p);state.enabled.add(p);els.newPrime.value='';els.settingsError.textContent='';renderPrimeOptions()}
    function applySettings(){const lo=Number(els.min.value),hi=Number(els.max.value);if(!Number.isInteger(lo)||!Number.isInteger(hi)||lo<4||hi>9999||lo>hi){els.settingsError.textContent='请输入 4～9999 之间的有效范围，且最小值不能大于最大值。';return}if(!state.enabled.size){els.settingsError.textContent='请至少启用一个质因数。';return}renderKeypad();newQuestion()}

    const desktopSettings=matchMedia('(min-width:821px)');
    function syncSettingsPanel(){if(desktopSettings.matches)els.settingsPanel.open=true}
    syncSettingsPanel();
    if(desktopSettings.addEventListener)desktopSettings.addEventListener('change',syncSettingsPanel);
    else desktopSettings.addListener(syncSettingsPanel);

    els.undo.addEventListener('click',()=>{if(!state.locked){state.tokens.pop();renderEquation()}});
    els.clear.addEventListener('click',resetAnswer);els.retry.addEventListener('click',resetAnswer);els.check.addEventListener('click',checkAnswer);els.reveal.addEventListener('click',reveal);els.addPrime.addEventListener('click',addPrime);els.apply.addEventListener('click',applySettings);els.newPrime.addEventListener('keydown',e=>{if(e.key==='Enter')addPrime()});
    renderPrimeOptions();renderKeypad();newQuestion();
  })();
  </script>
</body>
</html>
