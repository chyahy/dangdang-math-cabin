    <script type="module">
        let scene, camera, renderer, controls;
        let cubes = [];
        let n = 3;
        let isExploded = false;
        const spacing = 1.05;

        function fitCamera(animateMove = true) {
            if (!camera || !controls) return;

            const isMobile = window.innerWidth <= 720;
            const halfModel = ((n - 1) * spacing + 0.95) / 2;
            const explodedPadding = isExploded ? 2.35 : 0;
            const radius = halfModel + explodedPadding + 0.65;
            const verticalFov = THREE.MathUtils.degToRad(camera.fov);
            const horizontalFov = 2 * Math.atan(Math.tan(verticalFov / 2) * camera.aspect);
            const limitingFov = Math.max(0.22, Math.min(verticalFov, horizontalFov));
            const distance = Math.max(isMobile ? 12 : 9, radius / Math.tan(limitingFov / 2) * (isMobile ? 1.36 : 1.22));
            const target = new THREE.Vector3(0, isMobile ? 0.45 : 0, 0);
            const direction = new THREE.Vector3(0.68, 0.63, 1).normalize();
            const destination = target.clone().add(direction.multiplyScalar(distance));

            if (animateMove) {
                gsap.to(camera.position, {
                    x: destination.x,
                    y: destination.y,
                    z: destination.z,
                    duration: 0.75,
                    ease: "power2.inOut"
                });
                gsap.to(controls.target, {
                    x: target.x,
                    y: target.y,
                    z: target.z,
                    duration: 0.75,
                    ease: "power2.inOut"
                });
            } else {
                camera.position.copy(destination);
                controls.target.copy(target);
                controls.update();
            }
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(8, 8, 12);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(10, 20, 10);
            scene.add(directionalLight);

            createCubes();
            fitCamera(false);
            animate();
        }

        function createCubes() {
            // 清除旧方块
            cubes.forEach(c => scene.remove(c));
            cubes = [];

            const offset = (n - 1) / 2;

            for (let x = 0; x < n; x++) {
                for (let y = 0; y < n; y++) {
                    for (let z = 0; z < n; z++) {
                        const geometry = new THREE.BoxGeometry(0.95, 0.95, 0.95);
                        
                        // 计算涂色面数
                        let paintCount = 0;
                        if (x === 0 || x === n - 1) paintCount++;
                        if (y === 0 || y === n - 1) paintCount++;
                        if (z === 0 || z === n - 1) paintCount++;

                        // 根据涂色面数设置颜色
                        let color;
                        switch(paintCount) {
                            case 3: color = 0xef4444; break; // 红色
                            case 2: color = 0x22c55e; break; // 绿色
                            case 1: color = 0xeab308; break; // 黄色
                            default: color = 0x9ca3af; break; // 灰色
                        }

                        // 为每个面设置材质，只有暴露在外的面才有颜色，内部面为灰色
                        const innerColor = 0x9ca3af; // 内部灰色
                        const materials = [
                            new THREE.MeshPhongMaterial({ color: (x === n - 1) ? color : innerColor }), // 右
                            new THREE.MeshPhongMaterial({ color: (x === 0) ? color : innerColor }),     // 左
                            new THREE.MeshPhongMaterial({ color: (y === n - 1) ? color : innerColor }), // 上
                            new THREE.MeshPhongMaterial({ color: (y === 0) ? color : innerColor }),     // 下
                            new THREE.MeshPhongMaterial({ color: (z === n - 1) ? color : innerColor }), // 前
                            new THREE.MeshPhongMaterial({ color: (z === 0) ? color : innerColor })      // 后
                        ];

                        const cube = new THREE.Mesh(geometry, materials);
                        
                        // 初始位置
                        const posX = (x - offset) * spacing;
                        const posY = (y - offset) * spacing;
                        const posZ = (z - offset) * spacing;
                        cube.position.set(posX, posY, posZ);
                        
                        // 存储元数据
                        cube.userData = {
                            gridPos: { x, y, z },
                            originalPos: new THREE.Vector3(posX, posY, posZ),
                            paintCount: paintCount,
                            explodeDir: new THREE.Vector3(x - offset, y - offset, z - offset).normalize()
                        };

                        scene.add(cube);
                        cubes.push(cube);
                    }
                }
            }
            updateStats();
        }

        function updateStats() {
            const total = n * n * n;
            const c3 = 8;
            const c2 = Math.max(0, 12 * (n - 2));
            const c1 = Math.max(0, 6 * (n - 2) * (n - 2));
            const c0 = Math.max(0, (n - 2) * (n - 2) * (n - 2));

            document.getElementById('statTotal').innerText = total;
            document.getElementById('stat3').innerText = c3;
            document.getElementById('stat2').innerText = c2;
            document.getElementById('stat1').innerText = c1;
            document.getElementById('stat0').innerText = c0;
        }

        function toggleExplode() {
            isExploded = !isExploded;
            const btn = document.getElementById('explodeBtn');
            btn.innerText = isExploded ? "合拢演示" : "炸开演示";
            document.querySelector('.ui-panel').classList.remove('filters-open');
            document.getElementById('mobileFilterBtn').setAttribute('aria-expanded', 'false');
            document.getElementById('mobileFilterBtn').innerText = '筛选方块';

            cubes.forEach(cube => {
                const targetPos = isExploded 
                    ? cube.userData.originalPos.clone().add(cube.userData.explodeDir.clone().multiplyScalar(2))
                    : cube.userData.originalPos;

                gsap.to(cube.position, {
                    x: targetPos.x,
                    y: targetPos.y,
                    z: targetPos.z,
                    duration: 1,
                    ease: "power2.inOut"
                });
            });
            fitCamera(true);
        }

        function updateVisibility() {
            const show3 = document.getElementById('toggle3').checked;
            const show2 = document.getElementById('toggle2').checked;
            const show1 = document.getElementById('toggle1').checked;
            const show0 = document.getElementById('toggle0').checked;

            cubes.forEach(cube => {
                const count = cube.userData.paintCount;
                let visible = true;
                if (count === 3 && !show3) visible = false;
                if (count === 2 && !show2) visible = false;
                if (count === 1 && !show1) visible = false;
                if (count === 0 && !show0) visible = false;
                
                gsap.to(cube.scale, {
                    x: visible ? 1 : 0,
                    y: visible ? 1 : 0,
                    z: visible ? 1 : 0,
                    duration: 0.4,
                    onComplete: () => { cube.visible = visible; }
                });
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // 事件监听
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
            fitCamera(false);
        });

        document.getElementById('sizeSlider').addEventListener('input', (e) => {
            n = parseInt(e.target.value);
            document.getElementById('sizeValue').innerText = n;
            isExploded = false;
            document.getElementById('explodeBtn').innerText = "炸开演示";
            createCubes();
            fitCamera(true);
        });

        document.getElementById('explodeBtn').addEventListener('click', toggleExplode);
        document.getElementById('resetBtn').addEventListener('click', () => {
            fitCamera(true);
        });

        const mobileFilterBtn = document.getElementById('mobileFilterBtn');
        const uiPanel = document.querySelector('.ui-panel');
        mobileFilterBtn.addEventListener('click', () => {
            const opened = uiPanel.classList.toggle('filters-open');
            mobileFilterBtn.setAttribute('aria-expanded', String(opened));
            mobileFilterBtn.innerText = opened ? '收起筛选' : '筛选方块';
        });

        ['toggle3', 'toggle2', 'toggle1', 'toggle0'].forEach(id => {
            document.getElementById(id).addEventListener('change', updateVisibility);
        });

        // 规律面板交互
        const ruleBtn = document.getElementById('ruleBtn');
        const rulePanel = document.getElementById('rulePanel');
        const closeRuleBtn = document.getElementById('closeRuleBtn');

        ruleBtn.addEventListener('click', () => {
            rulePanel.classList.add('active');
            rulePanel.style.display = 'block';
            gsap.fromTo(rulePanel, { x: 50, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "back.out(1.7)" });
        });

        closeRuleBtn.addEventListener('click', () => {
            gsap.to(rulePanel, { x: 50, opacity: 0, duration: 0.3, onComplete: () => {
                rulePanel.classList.remove('active');
                rulePanel.style.display = 'none';
            }});
        });

        init();
    </script>

</body>

</html>
