<script>
/* Exact face-hinge unfolding for convex polyhedra. No geometry is scaled or stretched. */
(function(root){
  'use strict';
  const sub=(a,b)=>a.map((v,i)=>v-b[i]), add=(a,b)=>a.map((v,i)=>v+b[i]);
  const dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0);
  const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
  const unit=v=>{const l=Math.hypot(...v);return v.map(n=>n/l)};
  function axisRotate(v,axis,angle){
    const c=Math.cos(angle),s=Math.sin(angle),d=dot(axis,v),k=cross(axis,v);
    return v.map((n,i)=>n*c+k[i]*s+axis[i]*d*(1-c));
  }
  function polygonArea(vertices){let area=0;for(let i=1;i<vertices.length-1;i++)area+=Math.hypot(...cross(sub(vertices[i],vertices[0]),sub(vertices[i+1],vertices[0])))/2;return area}
  function tree(model,allowed=null){
    const {vertices,faces,normals}=model;
    let rootFace=0,lowest=Infinity;
    faces.forEach((f,i)=>{const y=f.reduce((s,v)=>s+vertices[v][1]/f.length,0);if(y<lowest){lowest=y;rootFace=i}});
    const adjacency=faces.map(()=>[]),edges=new Map();
    faces.forEach((f,fi)=>f.forEach((a,i)=>{
      const b=f[(i+1)%f.length],key=[Math.min(a,b),Math.max(a,b)].join(':');
      if(edges.has(key)){const p=edges.get(key);if(!allowed||allowed.has([fi,p.face].sort((a,b)=>a-b).join(':'))){adjacency[fi].push({face:p.face,a,b});adjacency[p.face].push({face:fi,a,b})}}
      else edges.set(key,{face:fi,a,b});
    }));
    const nodes=Array(faces.length).fill(null),queue=[rootFace];nodes[rootFace]={parent:-1,root:true,angle:0};
    for(let i=0;i<queue.length;i++){
      const parent=queue[i];
      for(const e of adjacency[parent])if(!nodes[e.face]){
        const axis=unit(sub(vertices[e.b],vertices[e.a]));
        const nc=normals[e.face],np=normals[parent];
        nodes[e.face]={parent,a:e.a,b:e.b,axis,angle:Math.atan2(dot(axis,cross(nc,np)),Math.max(-1,Math.min(1,dot(nc,np))))};
        queue.push(e.face);
      }
    }
    if(queue.length!==faces.length)throw new Error('图形的各个面必须连通。');
    return {rootFace,nodes,order:queue};
  }
  function unfold(model,amount,topology=tree(model)){
    amount=Math.max(0,Math.min(1,amount));
    function transform(point,face){
      let p=[...point],n=topology.nodes[face];
      while(n.parent!==-1){const origin=model.vertices[n.a];p=add(origin,axisRotate(sub(p,origin),n.axis,n.angle*amount));n=topology.nodes[n.parent]}
      return p;
    }
    return {rootFace:topology.rootFace,faces:model.faces.map((f,i)=>({id:i,points:f.map(v=>transform(model.vertices[v],i)),normal:unit(cross(sub(transform(model.vertices[f[1]],i),transform(model.vertices[f[0]],i)),sub(transform(model.vertices[f[2]],i),transform(model.vertices[f[0]],i))))})),hinges:topology.order.filter(i=>topology.nodes[i].parent!==-1).map(i=>{const n=topology.nodes[i];return {a:transform(model.vertices[n.a],i),b:transform(model.vertices[n.b],i),face:i,parent:n.parent}})};
  }
  function surfaceArea(model){return model.faces.reduce((s,f)=>s+polygonArea(f.map(i=>model.vertices[i])),0)}
  function curvedNet(kind,dims){
    const r=dims.r,h=dims.h;
    if(kind==='cylinder')return {kind,r,h,width:2*Math.PI*r,height:h+4*r,area:2*Math.PI*r*(r+h)};
    if(kind==='cone'){const l=Math.hypot(r,h),angle=2*Math.PI*r/l;return {kind,r,h,l,angle,degrees:angle*180/Math.PI,area:Math.PI*r*(r+l)}}
    return null;
  }
  function cubeNets(model){
    const links=model.edges.map(e=>[...e.faces].sort((a,b)=>a-b).join(':'));
    const length=Math.hypot(...sub(model.vertices[model.faces[0][0]],model.vertices[model.faces[0][1]]));
    function cellsFor(t){const net=unfold(model,1,t),centers=net.faces.map(f=>f.points.reduce((s,p)=>s.map((v,i)=>v+p[i]/f.points.length),[0,0,0])),origin=centers[t.rootFace];return centers.map(p=>[Math.round((p[0]-origin[0])/length),Math.round((p[2]-origin[2])/length)])}

$('netNote').textContent=sphere?'球面没有完整、无变形的平面展开图。可以旋转观察球面；切开或拉伸后得到的图形，不是精确展开图。':current==='cylinder'?'侧面展开是长方形，长等于底面周长 2πr，宽等于高 h，再加上 2 个圆形底面。':current==='cone'?'侧面展开是扇形，半径是母线 l，弧长等于底面周长 2πr，再加上 1 个圆形底面。':'金色面是连接中心。其他面沿公共棱转动，不拉伸、不改变大小；虚线表示仍然相连的折叠线。';
$('stageHint').textContent=unfoldAmount>0?(curved?'平面展开图 · 拖动平移 · 双指缩放':'拖动改变观察角度 · 双指缩放与平移'):'拖动旋转 · 双指缩放与平移 · 方向键也可以操作';
$('spin').disabled=unfoldAmount>0;
$('hidden').disabled=unfoldAmount>0||sphere;$('labels').disabled=unfoldAmount>0||curved;$('axisToggle').disabled=unfoldAmount>0;
$('toolNote').textContent=unfoldAmount>0?(curved?'展开图由准确的长方形、圆或扇形组成。':'展开图中用实线表示边界，虚线表示连接各面的折叠线。'):curved?'曲面的轮廓随视角变化；绘图用的细分线不作为图形的棱。':'虚线表示从当前角度看不到的棱。';
document.querySelectorAll('.view').forEach(b=>b.disabled=curved&&unfoldAmount>0);
$('scene').setAttribute('data-net-amount',unfoldAmount.toFixed(4));
if(unfoldAmount===0)$('scene').removeAttribute('data-net-face-count');
$('svgTitle').textContent=(unfoldAmount>0?'展开中的':'可旋转的')+defs[current].name;
}
function changeUnfold(value,animate=false){
if(current==='sphere')return;value=Math.max(0,Math.min(1,value));manual();panX=panY=0;zoom=1;
if(defs[current].curved){unfoldAmount=value>0?1:0;netAnimation=null;updateNetControls();dirty=true;return}
if(unfoldAmount===0&&value>0)netCamera={yaw,pitch};
const endYaw=value>0?netCamera.yaw*(1-value):netCamera.yaw,endPitch=value>0?netCamera.pitch+(Math.PI/2-netCamera.pitch)*value:netCamera.pitch;
if(animate&&!reduced.matches)netAnimation={start:performance.now(),from:unfoldAmount,to:value,yaw,pitch,endYaw,endPitch};
else{netAnimation=null;unfoldAmount=value;yaw=endYaw;pitch=endPitch;updateNetControls();dirty=true}
}
function renderCubeNetChoices(){
$('cubeNetChoices').replaceChildren();
cubeNetOptions.forEach((option,i)=>{const minX=Math.min(...option.cells.map(p=>p[0])),minY=Math.min(...option.cells.map(p=>p[1])),width=Math.max(...option.cells.map(p=>p[0]))-minX+1,height=Math.max(...option.cells.map(p=>p[1]))-minY+1;
const button=document.createElement('button');button.className='net-choice';button.dataset.net=String(i);button.setAttribute('aria-label','正方体展开图 '+(i+1));button.setAttribute('aria-pressed',String(i===cubeNetIndex));
button.innerHTML=`<svg viewBox="-0.15 -0.15 ${width+.3} ${height+.3}" aria-hidden="true">${option.cells.map(([x,y],fi)=>`<rect x="${x-minX}" y="${y-minY}" width="1" height="1" fill="${fi===option.topology.rootFace?'#f3ce85':'#a4d5dd'}" stroke="#426b73" stroke-width=".06"/>`).join('')}</svg><span>${i+1}</span>`;
button.addEventListener('click',()=>{cubeNetIndex=i;topology=option.topology;document.querySelectorAll('.net-choice').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.net)===i)));changeUnfold(1,false);message('已切换到第 '+(i+1)+' 种展开图，可以拖动进度看它折回正方体。')});$('cubeNetChoices').append(button);
});
}
$('toggleNet').addEventListener('click',()=>changeUnfold(netAnimation?1-netAnimation.to:unfoldAmount>0?0:1,true));
$('netAmount').addEventListener('input',e=>changeUnfold(Number(e.target.value)/100));
function updateFacts(){
const def=defs[current],d=dims;let stats;
if(!def.curved)stats=def.stats.map((n,i)=>[n,['个顶点','条棱','个面'][i]]);
else stats=current==='cylinder'?[[2,'个平面'],[1,'个曲面'],[0,'个顶点']]:current==='cone'?[[1,'个平面'],[1,'个曲面'],[1,'个顶点']]:[[0,'个平面'],[1,'个曲面'],[0,'个顶点']];
$('facts').innerHTML=stats.map(([n,text])=>`<div class="fact"><b>${n}</b><span>${text}</span></div>`).join('');
$('volumeFormula').textContent=def.formula;
let volume=0;
switch(current){case 'cube':volume=d.a**3;break;case 'cuboid':volume=d.a*d.b*d.h;break;case 'frustum':volume=d.h*d.a*d.a*(1+d.ratio+d.ratio*d.ratio)/3;break;case 'pyramid':volume=d.a*d.a*d.h/3;break;case 'triprism':volume=Math.sqrt(3)/4*d.a*d.a*d.h;break;case 'hexprism':volume=3*Math.sqrt(3)/2*d.a*d.a*d.h;break;case 'tetra':volume=Math.sqrt(3)/12*d.a*d.a*d.h;break;case 'cylinder':volume=Math.PI*d.r*d.r*d.h;break;case 'cone':volume=Math.PI*d.r*d.r*d.h/3;break;case 'sphere':volume=4*Math.PI*d.r**3/3;break;}
$('volumeResult').textContent=`V ≈ ${volume.toFixed(2)} 立方单位`;
const surface=current==='sphere'?4*Math.PI*d.r*d.r:current==='cylinder'||current==='cone'?SolidNets.curvedNet(current,d).area:SolidNets.surfaceArea(model);
$('surfaceResult').textContent=`S ≈ ${surface.toFixed(2)} 平方单位`;
$('surfaceFormula').textContent=current==='sphere'?'S = 4πr²':current==='cylinder'?'S = 2πr² + 2πrh':current==='cone'?'S = πr² + πrl（l 为母线）':current==='cube'?'S = 6a²':current==='cuboid'?'S = 2(ab + ah + bh)':'S = 各个面的面积之和';
$('dimensionNote').textContent=def.note+(current==='frustum'?` 当前 b = ${(d.a*d.ratio).toFixed(2)}。`:'');
$('factSubtitle').textContent=def.curved?'区分平面与曲面':'数一数它的结构';$('learningNote').textContent=def.learn;
}
function select(id){
current=id;const d=defs[id];dims=Object.fromEntries(d.params.map(p=>[p[0],p[4]]));
unfoldAmount=0;netAnimation=null;panX=panY=0;
document.querySelectorAll('.shape').forEach(button=>{const selected=button.dataset.shape===id;button.classList.toggle('active',selected);button.setAttribute('aria-pressed',selected)});
$('shapeTitle').textContent=d.name;$('svgTitle').textContent='可旋转的'+d.name;$('shapeTag').textContent=d.type;
$('sliders').innerHTML=d.params.map(([key,label,min,max,value])=>`<div class="slider-row"><div class="slider-caption"><label for="dim-${key}">${label}</label><input class="numeric-dim" id="num-${key}" data-param="${key}" type="number" min="${min}" max="${max}" value="${value}" step="${key==='ratio'?.05:.1}" aria-label="直接输入${label}"></div><input id="dim-${key}" data-param="${key}" type="range" min="${min}" max="${max}" value="${value}" step="${key==='ratio'?.05:.1}"></div>`).join('');
$('sliders').querySelectorAll('input').forEach(input=>{
const update=()=>{const key=input.dataset.param,value=Number(input.value);if(input.value===''||!Number.isFinite(value)){input.value=dims[key];return}const min=Number(input.min),max=Number(input.max),step=Number(input.step);dims[key]=Number((Math.round((Math.max(min,Math.min(max,value))-min)/step)*step+min).toFixed(3));$('dim-'+key).value=$('num-'+key).value=dims[key];build()};
input.addEventListener(input.type==='range'?'input':'change',update);if(input.type==='number')input.addEventListener('keydown',e=>{if(e.key==='Enter'){update();input.blur()}});
});
$('labels').disabled=!!d.curved;$('hidden').disabled=id==='sphere';
$('toolNote').textContent=d.curved?'曲面的轮廓随视角变化；绘图用的细分线不作为图形的棱。':'虚线表示从当前角度看不到的棱。';
yaw=-.62;pitch=.35;zoom=1;setViewSelected('space');build();updateNetControls();
}
function setSpin(value){playing=value;$('spin').textContent=playing?'Ⅱ 暂停转动':'▷ 自动转动';$('spin').setAttribute('aria-pressed',String(playing));last=null}
function setViewSelected(name){document.querySelectorAll('.view').forEach(b=>{const active=b.dataset.view===name;b.classList.toggle('selected',active);b.setAttribute('aria-pressed',String(active))})}
function manual(){setSpin(false);setViewSelected('');dirty=true}
$('spin').addEventListener('click',()=>{if(unfoldAmount>0){message('先收成立体，再观察自动转动。');return}setSpin(!playing);if(playing)setViewSelected('space')});
$('reset').addEventListener('click',()=>select(current));
document.querySelectorAll('.view').forEach(b=>b.addEventListener('click',()=>{const v=b.dataset.view;[yaw,pitch]=v==='front'?[0,0]:v==='top'?[0,Math.PI/2]:v==='side'?[-Math.PI/2,0]:[-.62,.35];setSpin(false);setViewSelected(v);dirty=true}));
for(const id of ['hidden','labels','axisToggle'])$(id).addEventListener('change',()=>{dirty=true});
document.querySelectorAll('.swatch').forEach(b=>b.addEventListener('click',()=>{color=b.dataset.color;document.querySelectorAll('.swatch').forEach(s=>s.setAttribute('aria-pressed',String(s===b)));dirty=true}));
const scene=$('scene');
function getPinch(){const [a,b]=[...touches.values()];return {gap:Math.hypot(a.x-b.x,a.y-b.y),x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
scene.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();manual();netAnimation=null;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});scene.setPointerCapture(e.pointerId);scene.classList.add('dragging');if(touches.size===1)drag={id:e.pointerId,x:e.clientX,y:e.clientY};else if(touches.size===2){pinch={...getPinch(),zoom,panX,panY};drag=null}});
scene.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2&&pinch){const p=getPinch(),r=scene.getBoundingClientRect();zoom=Math.max(.45,Math.min(2.2,pinch.zoom*p.gap/Math.max(8,pinch.gap)));panX=pinch.panX+(p.x-pinch.x)*800/r.width;panY=pinch.panY+(p.y-pinch.y)*600/r.height}else if(drag&&e.pointerId===drag.id){if(defs[current].curved&&unfoldAmount>0){const r=scene.getBoundingClientRect();panX+=(e.clientX-drag.x)*800/r.width;panY+=(e.clientY-drag.y)*600/r.height}else{yaw+=(e.clientX-drag.x)*.009;pitch=Math.max(-Math.PI/2,Math.min(Math.PI/2,pitch+(e.clientY-drag.y)*.009))}drag.x=e.clientX;drag.y=e.clientY}dirty=true});
function endDrag(e){if(e)touches.delete(e.pointerId);else touches.clear();if(touches.size===1){const [id,p]=[...touches.entries()][0];drag={id,...p};pinch=null}else{drag=null;pinch=null;scene.classList.remove('dragging')}if(e&&scene.hasPointerCapture(e.pointerId))scene.releasePointerCapture(e.pointerId)}scene.addEventListener('pointerup',endDrag);scene.addEventListener('pointercancel',endDrag);scene.addEventListener('lostpointercapture',endDrag);window.addEventListener('blur',()=>endDrag());
window.addEventListener('resize',()=>{endDrag();dirty=true});
scene.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.65,Math.min(1.45,zoom*Math.exp(-e.deltaY*.001)));dirty=true},{passive:false});
scene.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','-','='].includes(e.key))return;e.preventDefault();manual();if(e.key==='ArrowLeft')yaw-=.12;if(e.key==='ArrowRight')yaw+=.12;if(e.key==='ArrowUp')pitch=Math.min(Math.PI/2,pitch+.12);if(e.key==='ArrowDown')pitch=Math.max(-Math.PI/2,pitch-.12);if(e.key==='+'||e.key==='=')zoom=Math.min(1.45,zoom+.05);if(e.key==='-')zoom=Math.max(.65,zoom-.05)});
function fit(){zoom=1;panX=panY=0;if(unfoldAmount>=.999&&!defs[current].curved){yaw=0;pitch=Math.PI/2}dirty=true}
$('zoomOut').addEventListener('click',()=>{zoom=Math.max(.45,zoom*.85);dirty=true});$('zoomIn').addEventListener('click',()=>{zoom=Math.min(2.2,zoom/ .85);dirty=true});$('fit').addEventListener('click',fit);
$('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else message('可以将手机横屏，获得更大的观察区域。')}catch{message('当前浏览器暂不支持全屏。')}});
$('exportPNG').addEventListener('click',async()=>{
const wasPlaying=playing;setSpin(false);if(dirty)render();const copy=scene.cloneNode(true);copy.setAttribute('width','1600');copy.setAttribute('height','1200');copy.style.background='#f9fcfc';
const blob=new Blob([new XMLSerializer().serializeToString(copy)],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),image=new Image();
try{await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=url});const canvas=document.createElement('canvas');canvas.width=1600;canvas.height=1200;const context=canvas.getContext('2d');context.fillStyle='#f9fcfc';context.fillRect(0,0,1600,1200);context.drawImage(image,0,0);context.fillStyle='#466e74';context.font='23px Microsoft YaHei';context.fillText('当当老师 · '+defs[current].name+(unfoldAmount>0?' · 展开图':''),45,1155);const png=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!png)throw Error();const target=URL.createObjectURL(png),link=document.createElement('a');link.href=target;link.download='当当老师-'+defs[current].name+(unfoldAmount>0?'-展开图':'')+'.png';link.click();setTimeout(()=>URL.revokeObjectURL(target),1500);message('图片已导出。')}catch{message('导出暂时失败，请换用 Edge 或 Chrome 再试。')}finally{URL.revokeObjectURL(url);if(wasPlaying&&unfoldAmount===0)setSpin(true)}
});
reduced.addEventListener('change',e=>{if(e.matches){setSpin(false);if(netAnimation)changeUnfold(netAnimation.to)}});
document.addEventListener('visibilitychange',()=>{last=null;if(document.hidden)endDrag()});
function frame(now){if(!document.hidden){if(netAnimation){const t=Math.min(1,(now-netAnimation.start)/1150),s=t*t*(3-2*t);unfoldAmount=netAnimation.from+(netAnimation.to-netAnimation.from)*s;yaw=netAnimation.yaw+(netAnimation.endYaw-netAnimation.yaw)*s;pitch=netAnimation.pitch+(netAnimation.endPitch-netAnimation.pitch)*s;if(t===1){unfoldAmount=netAnimation.to;netAnimation=null}updateNetControls();dirty=true}if(last!==null&&playing&&unfoldAmount===0){yaw+=Math.min((now-last)/1000,.08)*.24;dirty=true}if(dirty&&now-lastDraw>32){render();lastDraw=now}}last=now;requestAnimationFrame(frame)}
select('cube');setSpin(playing);render();requestAnimationFrame(frame);
})();
</script>
